name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy requests rank-bm25
      - name: Pipeline tests
        run: python -m unittest discover -s pipeline -p "test_*.py"
      - name: RAG tests
        run: python -m unittest discover -s rag -p "test_*.py"
      - name: Training notebook tests
        run: python -m unittest discover -s training -p "test_v3_notebooks.py"
